<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="PreVis Dashboard — Monitor machine health status, vibration, temperature, RPM, and predictive alerts in real-time.">
  <title>PreVis — Dashboard</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="dashboard.css">
</head>

<body>
  <!-- Top Navbar -->
  <nav class="top-navbar" id="top-navbar"></nav>

  <!-- Sub Navigation -->
  <div class="sub-nav" id="sub-nav"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Summary Cards -->
    <section class="summary-cards" id="summary-cards">
      <div class="summary-card" id="card-total">
        <div class="summary-icon">
          <img src="assets/total_machine_icon.png" alt="Total Machines">
        </div>
        <div class="summary-info">
          <span class="summary-label" data-i18n="totalMachine">Total Mesin</span>
          <span class="summary-value" id="total-count">—</span>
          <span class="summary-sub" data-i18n="allSystems">Semua sistem</span>
        </div>
      </div>
      <div class="summary-card card-critical" id="card-critical">
        <div class="summary-icon">
          <img src="assets/critical_icon.png" alt="Critical">
        </div>
        <div class="summary-info">
          <span class="summary-label" data-i18n="critical">Kritis</span>
          <span class="summary-value" id="critical-count">—</span>
          <span class="summary-sub" id="critical-pct">—</span>
        </div>
      </div>
      <div class="summary-card card-warning" id="card-warning">
        <div class="summary-icon">
          <img src="assets/warning_icon.png" alt="Warning">
        </div>
        <div class="summary-info">
          <span class="summary-label" data-i18n="warning">Peringatan</span>
          <span class="summary-value" id="warning-count">—</span>
          <span class="summary-sub" id="warning-pct">—</span>
        </div>
      </div>
      <div class="summary-card card-healthy" id="card-healthy">
        <div class="summary-icon">
          <img src="assets/healthy_icon.png" alt="Healthy">
        </div>
        <div class="summary-info">
          <span class="summary-label" data-i18n="healthy">Sehat</span>
          <span class="summary-value" id="healthy-count">—</span>
          <span class="summary-sub" id="healthy-pct">—</span>
        </div>
      </div>
    </section>

    <!-- Health Gauge Section -->
    <section class="health-section">
      <h2 class="section-title" data-i18n="healthGauge">Indikator Kesehatan</h2>
      <div class="machine-grid" id="machine-grid">
        <!-- Machine cards populated by JS -->
        <div class="loading-placeholder">
          <div class="skeleton" style="height:280px; width:100%"></div>
          <div class="skeleton" style="height:280px; width:100%"></div>
          <div class="skeleton" style="height:280px; width:100%"></div>
          <div class="skeleton" style="height:280px; width:100%"></div>
        </div>
      </div>

      <div class="view-all-container">
        <button class="view-all-btn" id="view-all-btn" data-i18n="viewAllMachines">Lihat Semua Mesin</button>
      </div>
    </section>
  </main>

  <link rel="stylesheet" href="chatbot.css">
  <script src="shared.js"></script>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="chatbot.js"></script>
  <script>
    // Auth guard
    const user = requireAuth();
    if (user) {
      renderNavbar('dashboard');
      loadDashboard();
      setInterval(loadDashboard, 10000);
    }

    async function loadDashboard() {
      try {
        // Load summary + machines in parallel
        const [summary, machines] = await Promise.all([
          api.get('/dashboard/summary'),
          api.get('/machines'),
        ]);

        renderSummary(summary);
        renderMachineGrid(machines);
      } catch (err) {
        console.error('Dashboard load error:', err);
      }
    }

    function renderSummary(s) {
      animateCount('total-count', s.total);
      animateCount('critical-count', s.critical);
      animateCount('warning-count', s.warning);
      animateCount('healthy-count', s.healthy);
      document.getElementById('critical-pct').textContent = `${s.critical_pct}% dari Total`;
      document.getElementById('warning-pct').textContent = `${s.warning_pct}% dari Total`;
      document.getElementById('healthy-pct').textContent = `${s.healthy_pct}% dari Total`;
    }

    function animateCount(elementId, target) {
      const el = document.getElementById(elementId);
      const duration = 800;
      const start = performance.now();
      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(ease * target);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    let currentAssetPage = 1;
    const assetsPerPage = 10;
    let assetFilterQuery = '';

    function renderMachineGrid(machines) {
      const grid = document.getElementById('machine-grid');
      const activeElement = document.activeElement;
      const keepFilterFocus = activeElement && activeElement.classList.contains('asset-filter');
      const filterCursorPosition = keepFilterFocus ? activeElement.selectionStart : null;
      const filteredMachines = filterMachineAssets(machines);
      const totalPages = Math.max(1, Math.ceil(filteredMachines.length / assetsPerPage));
      currentAssetPage = Math.min(currentAssetPage, totalPages);
      const start = (currentAssetPage - 1) * assetsPerPage;
      const displayed = filteredMachines.slice(start, start + assetsPerPage);

      grid.innerHTML = `
        <div class="asset-table-card card">
          <div class="asset-filter-toolbar">
            <input class="asset-filter" value="${escapeHtml(assetFilterQuery)}" placeholder="Filter aset berdasarkan ID, nama, tipe, lokasi, status, health, atau RUL">
            <button class="filter-reset-btn" type="button">Reset</button>
          </div>
          <div class="asset-table-scroll">
            <table class="asset-health-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nama Mesin</th>
                  <th>Tipe</th>
                  <th>Lokasi</th>
                  <th>Health Score</th>
                  <th>Status</th>
                  <th>RUL Est.</th>
                  <th>Jam Operasi</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${displayed.length ? displayed.map(renderAssetRow).join('') : renderEmptyAssetRow()}
              </tbody>
            </table>
          </div>
          <div class="asset-table-footer">
            <span>Menampilkan ${displayed.length} dari ${filteredMachines.length} aset tersaring (${machines.length} total)</span>
            <div class="asset-pagination">
              <button class="page-btn" data-page="${currentAssetPage - 1}" ${currentAssetPage === 1 ? 'disabled' : ''}>← Prev</button>
              ${Array.from({ length: totalPages }, (_, i) => `
                <button class="page-btn ${currentAssetPage === i + 1 ? 'active' : ''}" data-page="${i + 1}">${i + 1}</button>
              `).join('')}
              <button class="page-btn" data-page="${currentAssetPage + 1}" ${currentAssetPage === totalPages ? 'disabled' : ''}>Next →</button>
            </div>
          </div>
        </div>
      `;

      const viewBtn = document.getElementById('view-all-btn');
      viewBtn.closest('.view-all-container').style.display = 'none';

      grid.querySelector('.asset-filter').addEventListener('input', event => {
        const cursorPosition = event.target.selectionStart;
        assetFilterQuery = event.target.value;
        currentAssetPage = 1;
        renderMachineGrid(machines);
        const nextControl = grid.querySelector('.asset-filter');
        nextControl.focus();
        nextControl.setSelectionRange(cursorPosition, cursorPosition);
      });

      grid.querySelector('.filter-reset-btn').addEventListener('click', () => {
        assetFilterQuery = '';
        currentAssetPage = 1;
        renderMachineGrid(machines);
      });

      if (keepFilterFocus) {
        const nextControl = grid.querySelector('.asset-filter');
        nextControl.focus();
        if (typeof filterCursorPosition === 'number') {
          nextControl.setSelectionRange(filterCursorPosition, filterCursorPosition);
        }
      }

      grid.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const page = Number(btn.dataset.page);
          if (page < 1 || page > totalPages || page === currentAssetPage) return;
          currentAssetPage = page;
          renderMachineGrid(machines);
        });
      });
    }

    function filterMachineAssets(machines) {
      const query = assetFilterQuery.trim().toLowerCase();
      if (!query) return machines;

      return machines.filter(machine => {
        const status = getStatusClass(machine.alert_level);
        const label = getStatusLabel(machine.alert_level);
        const healthScore = Math.max(0, Math.min(100, getHealthScore(machine.failure_prob)));
        const healthTone = getHealthTone(status, healthScore);
        const searchable = [
          machine.machine_id,
          getMachineName(machine),
          getMachineType(machine),
          machine.location,
          status,
          label,
          `${healthScore}%`,
          healthTone,
          formatRul(machine.rul_estimated),
          formatOperatingHours(machine.install_date),
        ].join(' ').toLowerCase();

        return searchable.includes(query);
      });
    }

    function renderAssetRow(m) {
      const status = getStatusClass(m.alert_level);
      const label = getStatusLabel(m.alert_level);
      const healthScore = Math.max(0, Math.min(100, getHealthScore(m.failure_prob)));
      const healthTone = getHealthTone(status, healthScore);

      return `
          <tr>
            <td data-label="ID"><span class="asset-id">${escapeHtml(m.machine_id)}</span></td>
            <td data-label="Nama"><span class="asset-name">${escapeHtml(getMachineName(m))}</span></td>
            <td data-label="Tipe"><span class="asset-type-pill">${escapeHtml(getMachineType(m))}</span></td>
            <td data-label="Lokasi">${escapeHtml(m.location || '—')}</td>
            <td data-label="Health">
              <div class="health-meter health-${healthTone}">
                <span class="health-track">
                  <span class="health-fill" style="width: ${healthScore}%"></span>
                </span>
                <span class="health-value">${healthScore}%</span>
              </div>
            </td>
            <td data-label="Status">
              <span class="badge badge-${status}">
                <span class="badge-dot"></span>
                ${label}
              </span>
            </td>
            <td data-label="RUL Est."><span class="rul-value rul-${healthTone}">~${formatRul(m.rul_estimated)}</span></td>
            <td data-label="Jam Ops">${formatOperatingHours(m.install_date)}</td>
            <td data-label="Aksi">
              <button class="detail-btn" type="button" onclick="location.href='/analytics.html?machine=${encodeURIComponent(m.machine_id)}'">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                Detail
              </button>
            </td>
          </tr>
        `;
    }

    function renderEmptyAssetRow() {
      return `
        <tr>
          <td class="asset-empty-row" colspan="9">Tidak ada aset yang cocok dengan filter.</td>
        </tr>
      `;
    }

    function getMachineName(machine) {
      return machine.model_type || `Mesin ${machine.machine_id}`;
    }

    function getMachineType(machine) {
      const type = machine.model_type || 'Machine';
      return type.split(/[\s-]/).slice(0, 2).join(' ');
    }

    function getHealthTone(status, score) {
      if (status === 'critical' || score < 40) return 'critical';
      if (status === 'warning' || score < 75) return 'warning';
      return 'healthy';
    }

    function formatRul(value) {
      const days = Number(value);
      if (!Number.isFinite(days)) return '—';
      return `${Math.max(0, Math.round(days))} hari`;
    }

    function formatOperatingHours(installDate) {
      const installedAt = new Date(installDate).getTime();
      if (!Number.isFinite(installedAt)) return '—';
      const hours = Math.max(0, Math.round((Date.now() - installedAt) / 36e5));
      return `${formatNumber(hours)} jam`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

  </script>
</body>

</html>
