<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PreVis Notifications — View machine anomaly alerts, failure predictions, and recommended maintenance actions.">
  <title>PreVis — Notifications</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
  <!-- Top Navbar -->
  <nav class="top-navbar" id="top-navbar"></nav>

  <!-- Sub Navigation -->
  <div class="sub-nav" id="sub-nav"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">Notification</h1>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar card">
      <div class="filter-left">
        <span class="filter-label">Filter</span>
        <div class="filter-buttons" id="filter-buttons">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn btn-healthy" data-status="healthy">Healthy</button>
          <button class="filter-btn btn-warning" data-status="warning">Warning</button>
          <button class="filter-btn btn-critical" data-status="critical">Critical</button>
        </div>
      </div>
      <div class="filter-right">
        <span class="filter-label">Date</span>
        <div class="date-display" id="date-display">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
          <span id="date-range-text">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-container card">
      <table class="data-table" id="data-table">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Machine ID</th>
            <th>Failure Type</th>
            <th>Status</th>
            <th>Anomaly Description</th>
            <th>Recommended Action</th>
            <th>Action Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" class="loading-cell"><div class="skeleton" style="height:24px; width:60%"></div></td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-bar" id="pagination-bar">
      <span class="pagination-info" id="pagination-info">Loading...</span>
      <div class="pagination-controls" id="pagination-controls"></div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    const user = requireAuth();
    if (user) {
      renderNavbar('notifications');
      initNotifications();
    }

    let currentStatus = 'all';
    let currentPage = 1;
    const limit = 8;

    function initNotifications() {
      // Set date range display
      const now = new Date();
      const sevenAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      document.getElementById('date-range-text').textContent =
        `${formatDate(sevenAgo)} - ${formatDate(now)}`;

      // Filter buttons
      document.getElementById('filter-buttons').addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentStatus = e.target.dataset.status;
          currentPage = 1;
          loadNotifications();
        }
      });

      loadNotifications();
    }

    async function loadNotifications() {
      try {
        const data = await api.get(`/notifications?status=${currentStatus}&page=${currentPage}&limit=${limit}`);
        renderTable(data.notifications);
        renderPagination(data.pagination);
      } catch (err) {
        console.error('Notifications load error:', err);
        document.getElementById('table-body').innerHTML =
          '<tr><td colspan="7" class="loading-cell" style="color: var(--critical)">Failed to load notifications</td></tr>';
      }
    }

    function renderTable(notifications) {
      const tbody = document.getElementById('table-body');

      if (notifications.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="loading-cell">No notifications found</td></tr>';
        return;
      }

      tbody.innerHTML = notifications.map(n => {
        const statusClass = n.status === 'Healthy' ? 'healthy'
          : n.status === 'Warning' ? 'warning' : 'critical';

        const actionClass = n.action_status === 'Closed' ? 'action-closed'
          : n.action_status === 'In Progress' ? 'action-in-progress' : 'action-open';

        return `
          <tr class="table-row" onclick="location.href='/analytics.html?machine=${n.machine_id}'">
            <td>
              <div class="ts-date">${formatDate(n.timestamp)}</div>
              <div class="ts-time">${formatTime(n.timestamp)}</div>
            </td>
            <td><span class="machine-link">${n.machine_id}</span></td>
            <td>${n.failure_type}</td>
            <td><span class="badge badge-${statusClass}"><span class="badge-dot"></span>${n.status}</span></td>
            <td class="desc-cell">${n.anomaly_description}</td>
            <td class="desc-cell">${n.recommended_action}</td>
            <td><span class="action-badge ${actionClass}">${n.action_status}</span></td>
          </tr>
        `;
      }).join('');
    }

    function renderPagination(p) {
      const info = document.getElementById('pagination-info');
      const start = (p.page - 1) * p.limit + 1;
      const end = Math.min(p.page * p.limit, p.total);
      info.textContent = `Showing ${start} to ${end} of ${p.total} entries`;

      const controls = document.getElementById('pagination-controls');
      let html = '';

      // Previous
      html += `<button class="page-btn" ${p.page <= 1 ? 'disabled' : ''} onclick="goPage(${p.page - 1})">&lt;</button>`;

      // Page numbers
      for (let i = 1; i <= p.total_pages; i++) {
        if (i === p.page) {
          html += `<button class="page-btn page-active">${i}</button>`;
        } else if (Math.abs(i - p.page) <= 2 || i === 1 || i === p.total_pages) {
          html += `<button class="page-btn" onclick="goPage(${i})">${i}</button>`;
        } else if (Math.abs(i - p.page) === 3) {
          html += `<span class="page-dots">...</span>`;
        }
      }

      // Next
      html += `<button class="page-btn" ${p.page >= p.total_pages ? 'disabled' : ''} onclick="goPage(${p.page + 1})">&gt;</button>`;

      controls.innerHTML = html;
    }

    function goPage(page) {
      currentPage = page;
      loadNotifications();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
  <link rel="stylesheet" href="chatbot.css">
  <script src="chatbot.js"></script>
</body>
</html>
