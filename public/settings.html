<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PreVis Settings — Manage language, theme, account preferences, and notifications.">
    <title>PreVis — Settings</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="settings.css">
    <script src="shared.js"></script>
    <script src="i18n.js"></script>
    <script src="settings.js"></script>
</head>
<body>
    <!-- Top Navbar -->
    <nav class="top-navbar" id="top-navbar"></nav>

    <!-- Sub Navigation -->
    <div class="sub-nav" id="sub-nav"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="settingsTitle">Pengaturan</h1>
            <p class="page-subtitle" data-i18n="generalSettings">Manage your preferences</p>
        </div>

        <!-- Settings Container -->
        <div class="settings-container">
            
            <!-- Theme Settings -->
            <div id="theme-settings"></div>

            <!-- Account Settings -->
            <div id="account-settings"></div>

        </div>
    </main>

    <script>
        // Auth guard
        const user = requireAuth();
        if (user) {
            renderNavbar('settings');
            initSettings();
        }
    </script>
    <link rel="stylesheet" href="chatbot.css">
    <script src="chatbot.js"></script>
</body>
</html>
